name: "Dependabot Runtime Deps"
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    paths:
    - 'gradle/libs.versions.toml'
    - '**/*.gradle'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-runtime-deps:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        # Needed to push the regenerated baselines back to the Dependabot branch
        persist-credentials: true
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: zulu
        java-version: 17
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: true
    - run: ./gradlew generateRuntimeDeps -DallModules --rerun-tasks
    - name: Commit updated baselines
      run: |
        if git diff --quiet -- '*runtime-deps.txt'; then
          echo "No runtime-deps changes"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- '*runtime-deps.txt'
        git commit -m "Update runtime-deps baselines"
        git push
