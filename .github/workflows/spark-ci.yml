name: "Spark CI"
on:
  push:
    branches:
    - 'main'
    - '0.*'
    - '1.*'
    - '2.*'
    tags:
    - 'apache-iceberg-**'
  pull_request:
    paths-ignore:
    - '.github/ISSUE_TEMPLATE/**'
    - '.github/workflows/api-binary-compatibility.yml'
    - '.github/workflows/delta-conversion-ci.yml'
    - '.github/workflows/docs-ci.yml'
    - '.github/workflows/flink-ci.yml'
    - '.github/workflows/hive-ci.yml'
    - '.github/workflows/java-ci.yml'
    - '.github/workflows/jmh-benchmarks.yml'
    - '.github/workflows/kafka-connect-ci.yml'
    - '.github/workflows/cve-scan.yml'
    - '.github/workflows/labeler.yml'
    - '.github/workflows/license-check.yml'
    - '.github/workflows/open-api.yml'
    - '.github/workflows/pr-title-check.yml'
    - '.github/workflows/publish-snapshot.yml'
    - '.github/workflows/recurring-jmh-benchmarks.yml'
    - '.github/workflows/site-ci.yml'
    - '.github/workflows/stale.yml'
    - '.gitignore'
    - '.asf.yaml'
    - 'dev/**'
    - 'docker/**'
    - 'site/**'
    - 'mr/**'
    - 'flink/**'
    - 'kafka-connect/**'
    - 'docs/**'
    - 'open-api/**'
    - 'format/**'
    - '.gitattributes'
    - '**/*.md'
    - '**/LICENSE'
    - '**/NOTICE'
    - 'doap.rdf'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      spark: ${{ steps.plan.outputs.spark }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false
        sparse-checkout: gradle.properties
        sparse-checkout-cone-mode: false
    - id: plan
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        spark_versions_csv=$(sed -n 's/^systemProp\.knownSparkVersions=//p' gradle.properties)
        if [[ -z "${spark_versions_csv}" ]]; then
          echo "::error::Cannot read knownSparkVersions from gradle.properties"
          exit 1
        fi
        IFS=',' read -r -a spark_versions <<< "${spark_versions_csv}"

        # Narrow only when every changed file belongs to one supported Spark version.
        if [[ "${EVENT_NAME}" == "pull_request" ]] &&
            changed_files=$(git diff --no-renames --name-only HEAD^1 HEAD 2>/dev/null) &&
            [[ -n "${changed_files}" ]]; then
          for version in "${spark_versions[@]}"; do
            only_this_version=true
            while IFS= read -r path; do
              if [[ "${path}" != "spark/v${version}/"* ]]; then
                only_this_version=false
                break
              fi
            done <<< "${changed_files}"

            if [[ "${only_this_version}" == "true" ]]; then
              spark_versions=("${version}")
              break
            fi
          done
        fi
        spark=$(jq -cn --args '$ARGS.positional' "${spark_versions[@]}")
        echo "spark=${spark}" >> "${GITHUB_OUTPUT}"

  spark-tests:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # 20 is the Apache infra policy ceiling (https://infra.apache.org/github-actions-policy.html).
      # Keep matrix <= 20 jobs; exceeding it queues a second wave and slows CI.
      max-parallel: 20
      matrix:
        # Spark 3.5 is the first version not failing on Java 21 (https://issues.apache.org/jira/browse/SPARK-42369)
        jvm: [17, 21]
        event_name: ['${{ github.event_name }}']
        spark: ${{ fromJson(needs.plan.outputs.spark) }}
        scala: ['2.12', '2.13']
        # Split iceberg-spark (core) from iceberg-spark-extensions/-runtime
        # so they run as concurrent jobs rather than serially in one job.
        tests: [core, extensions]
        exclude:
          # Spark 4.0+ only supports Scala 2.13.
          - spark: '4.0'
            scala: '2.12'
          - spark: '4.1'
            scala: '2.12'
          - spark: '4.2'
            scala: '2.12'
          # Pull requests run the baseline JDK only.
          - event_name: pull_request
            jvm: 21
    env:
      SPARK_LOCAL_IP: localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: ${{ matrix.jvm }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Read-only: java-ci's build-checks (17) is the global canonical writer.
          cache-read-only: true
      - run: echo -e "$(ip addr show eth0 | grep "inet\b" | awk '{print $2}' | cut -d/ -f1)\t$(hostname -f) $(hostname -s)" | sudo tee -a /etc/hosts
      - name: Run tests
        env:
          SPARK_VERSION: ${{ matrix.spark }}
          SCALA_VERSION: ${{ matrix.scala }}
          TEST_GROUP: ${{ matrix.tests }}
        run: |
          if [[ "${TEST_GROUP}" == "core" ]]; then
            projects=(":iceberg-spark:iceberg-spark-${SPARK_VERSION}_${SCALA_VERSION}:check")
          else
            projects=(
              ":iceberg-spark:iceberg-spark-extensions-${SPARK_VERSION}_${SCALA_VERSION}:check"
              ":iceberg-spark:iceberg-spark-runtime-${SPARK_VERSION}_${SCALA_VERSION}:check"
            )
          fi
          ./gradlew -DsparkVersions="${SPARK_VERSION}" -DscalaVersion="${SCALA_VERSION}" -DflinkVersions= -DkafkaVersions= \
            "${projects[@]}" -Pquick=true -x javadoc -DtestParallelism=auto
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test logs (${{ matrix.jvm }}, ${{ matrix.spark }}, ${{ matrix.scala }}, ${{ matrix.tests }})
          retention-days: 7
          path: |
            **/build/testlogs
