if (jdkVersion != '17' && jdkVersion != '21') {
  throw new GradleException("The JMH benchmarks must be run with JDK 17 or JDK 21")
}

def flinkVersions = (System.getProperty("flinkVersions") != null ? System.getProperty("flinkVersions") : System.getProperty("defaultFlinkVersions")).split(",")
def sparkVersions = (System.getProperty("sparkVersions") != null ? System.getProperty("sparkVersions") : System.getProperty("defaultSparkVersions")).split(",")
def scalaVersion = System.getProperty("scalaVersion") != null ? System.getProperty("scalaVersion") : System.getProperty("defaultScalaVersion")
def jmhProjects = [project(":iceberg-core"), project(":iceberg-data")]

if (flinkVersions.contains("1.20")) {
  jmhProjects.add(project(":iceberg-flink:iceberg-flink-1.20"))
}

if (flinkVersions.contains("2.2")) {
    jmhProjects.add(project(":iceberg-flink:iceberg-flink-2.2"))
}

if (flinkVersions.contains("2.3")) {
    jmhProjects.add(project(":iceberg-flink:iceberg-flink-2.3"))
}

if (sparkVersions.contains("3.5")) {
  jmhProjects.add(project(":iceberg-spark:iceberg-spark-3.5_${scalaVersion}"))
  jmhProjects.add(project(":iceberg-spark:iceberg-spark-extensions-3.5_${scalaVersion}"))
}

if (sparkVersions.contains("4.0")) {
  jmhProjects.add(project(":iceberg-spark:iceberg-spark-4.0_2.13"))
  jmhProjects.add(project(":iceberg-spark:iceberg-spark-extensions-4.0_2.13"))
}

if (sparkVersions.contains("4.1")) {
    jmhProjects.add(project(":iceberg-spark:iceberg-spark-4.1_2.13"))
    jmhProjects.add(project(":iceberg-spark:iceberg-spark-extensions-4.1_2.13"))
}

if (sparkVersions.contains("4.2")) {
    jmhProjects.add(project(":iceberg-spark:iceberg-spark-4.2_2.13"))
    jmhProjects.add(project(":iceberg-spark:iceberg-spark-extensions-4.2_2.13"))
}

configure(jmhProjects) {
  apply plugin: 'me.champeau.jmh'
  apply plugin: 'io.morethan.jmhreport'

  def jmhReportDir = project.property("jmhJsonOutputPath").toString().replace(".json", "")
  mkdir(file(jmhReportDir))

  jmh {
    jmhVersion = '1.37'
    failOnError = true
    forceGC = true
    includeTests = true
    humanOutputFile = file(jmhOutputPath)
    jvmArgs = ['-Xmx32g'] + (project.hasProperty('extraJvmArgs') ? project.extraJvmArgs : [])
    resultsFile = file(jmhJsonOutputPath)
    resultFormat = 'JSON'
    includes = [jmhIncludeRegex]
    zip64 = true
  }

  jmhReport {
    jmhResultPath = file(jmhJsonOutputPath)
    jmhReportOutput = file(jmhReportDir)
  }

  jmhCompileGeneratedClasses {
    pluginManager.withPlugin('com.palantir.baseline-error-prone') {
      options.errorprone.enabled = false
    }
  }

  tasks.jmh.finalizedBy tasks.jmhReport

  // -PjmhJvmArgsAppend="..." adds JVM arguments after jvmArgs, e.g. a GPU runtime's argfile.
  if (project.hasProperty('jmhJvmArgsAppend')) {
    jmh {
      jvmArgsAppend = project.property('jmhJvmArgsAppend').toString().split(' ').findAll { it } as List
    }
  }

  // The Spark 4.2 merge-on-read benchmarks also run on the GPU scan when that module is built.
  if (project.name.startsWith('iceberg-spark-4.2_') && rootProject.findProject(':iceberg-tornadovm') != null) {
    dependencies {
      jmh project(':iceberg-tornadovm')
    }
    // That module targets Java 21 (FFM); only the benchmarks resolve and compile at 21.
    configurations.matching { it.name in ['jmhCompileClasspath', 'jmhRuntimeClasspath'] }.configureEach {
      attributes { attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21) }
    }
    tasks.matching { it.name in ['compileJmhJava', 'jmhCompileGeneratedClasses'] }.configureEach {
      options.release = 21
      options.compilerArgs += ['--enable-preview']
    }
    tasks.matching { it.name == 'jmhRunBytecodeGenerator' }.configureEach {
      jvmArgs.add('--enable-preview')
    }
  } else if (project.name.startsWith('iceberg-spark-4.2_')) {
    // Without the GPU module (no TORNADOVM_HOME), its benchmarks are left out.
    sourceSets.jmh.java.exclude '**/*GpuBenchmark.java'
  }
}
