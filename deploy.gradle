if (project.hasProperty('release') && jdkVersion != '17') {
  throw new GradleException("Releases must be built with Java 17")
}

subprojects {
  def isBom = it.name == 'iceberg-bom'
  def isOpenApi = it.name == 'iceberg-open-api'

  apply plugin: 'maven-publish'
  apply plugin: 'signing'
  afterEvaluate {

    if (!isBom) {
      task sourceJar(type: Jar, dependsOn: classes) {
        archiveClassifier.set('sources')
        from sourceSets.main.allSource
        group 'build'
      }

      task javadocJar(type: Jar, dependsOn: javadoc) {
        archiveClassifier.set('javadoc')
        from javadoc.destinationDir
        group 'build'
      }

      task testJar(type: Jar) {
        archiveClassifier.set('tests')
        from sourceSets.test.output
      }

      artifacts {
        archives sourceJar
        archives javadocJar
        archives testJar
        testArtifacts testJar
      }

      // add LICENSE and NOTICE
      [jar, sourceJar, javadocJar, testJar].each { task ->
        task.dependsOn rootProject.tasks.buildInfo
        task.from("${rootDir}/build") {
          include 'iceberg-build.properties'
        }
        task.from(rootDir) {
          include 'LICENSE'
          include 'NOTICE'
        }
      }
    }

    publishing {
      publications {
        apache(MavenPublication) {
          if (isBom) {
            from components.javaPlatform
          } else if (isOpenApi) {
            artifact testJar
            artifact testFixturesJar
          } else {
            if (tasks.matching({task -> task.name == 'shadowJar'}).isEmpty()) {
              from components.java
            } else {
              project.shadow.component(it)
            }

            artifact sourceJar
            artifact javadocJar
            artifact testJar

            versionMapping {
              allVariants {
                fromResolutionResult()
              }
            }
          }

          pom {
            name = 'SpiralDB Iceberg'
            description = 'SpiralDB fork of Apache Iceberg, a table format for huge analytic datasets'
            url = 'https://github.com/spiraldb/iceberg'
            licenses {
              license {
                name = 'The Apache Software License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
              }
            }
            developers {
              developer {
                name = 'SpiralDB'
                organization = 'SpiralDB'
                organizationUrl = 'https://spiraldb.com'
              }
            }
            scm {
              connection = 'scm:git:https://github.com/spiraldb/iceberg.git'
              developerConnection = 'scm:git:ssh://git@github.com/spiraldb/iceberg.git'
              url = 'https://github.com/spiraldb/iceberg'
            }
            issueManagement {
              system = 'GitHub'
              url = 'https://github.com/spiraldb/iceberg/issues'
            }
          }
        }
      }

      repositories {
        maven {
          credentials {
            username project.hasProperty('mavenUser') ? "$mavenUser" : ""
            password project.hasProperty('mavenPassword') ? "$mavenPassword" : ""
          }
          // upload to the releases repository using ./gradlew -Prelease publish
          // releases are staged in the Sonatype Central Portal through its OSSRH staging API
          def centralSnapshotsRepoUrl = 'https://central.sonatype.com/repository/maven-snapshots/'
          def centralReleasesRepoUrl = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
          def snapshotsRepoUrl = project.hasProperty('mavenSnapshotsRepo') ? "$mavenSnapshotsRepo" : "$centralSnapshotsRepoUrl"
          def releasesRepoUrl = project.hasProperty('mavenReleasesRepo') ? "$mavenReleasesRepo" : "$centralReleasesRepoUrl"
          url = project.hasProperty('release') ? releasesRepoUrl : snapshotsRepoUrl
        }
      }
    }

    if (project.hasProperty('release')) {
      signing {
        if (project.hasProperty('signingKey')) {
          useInMemoryPgpKeys(project.findProperty('signingKey'), project.findProperty('signingPassword'))
        } else {
          useGpgCmd()
        }
        sign publishing.publications.apache
      }
    }
  }
}
